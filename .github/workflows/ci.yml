name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Preserve quality reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-reports-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            coverage/
            reports/mutation/
